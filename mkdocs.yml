site_name: Logback Elasticsearch / OpenSearch Appender
site_description: Send Java Logback events asynchronously to Elasticsearch and OpenSearch. Quick start, configuration, authentication, and migration from internetitem.
site_url: https://agido-malter.github.io/logback-elasticsearch-appender/
repo_url: https://github.com/agido-malter/logback-elasticsearch-appender
repo_name: GitHub
edit_uri: ''
docs_dir: target/pages-src
site_dir: target/site
use_directory_urls: true
strict: true
theme:
  name: mkdocs
  custom_dir: docs/overrides
  color_mode: light
  user_color_mode_toggle: true
  navigation_depth: 3
  highlightjs: true
  hljs_languages:
    - xml
    - groovy
    - java
    - yaml
nav:
  - Overview: index.md
  - Quick start: getting-started.md
  - Guides:
      - Compatibility: compatibility.md
      - Migration: migration.md
      - Examples: examples.md
  - Reference:
      - Configuration: configuration.md
      - Authentication: authentication.md
      - Delivery & limits: delivery.md
  - Project:
      - Contributing & security: project.md
      - Changelog: changelog.md
plugins:
  - search
markdown_extensions:
  - tables
  - fenced_code
  - admonition
  - attr_list
  - toc:
      permalink: true
extra_css:
  - stylesheets/extra.css
extra_javascript:
  - javascripts/copy.js
copyright: Licensed under EPL-1.0 or LGPL-2.1.
