name: Publish to Maven Central

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to publish (for example v3.1.2)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: maven-central-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ github.event.release.tag_name || inputs.release_tag }}
    runs-on: ubuntu-latest

    container:
      image: maven:3.9.16-eclipse-temurin-25-noble

    environment:
      name: maven-central
      url: https://central.sonatype.com/publishing/deployments

    steps:
      - name: Release-Tag auschecken
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Java und Maven Central konfigurieren
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD

      - name: Release prüfen
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
          RELEASE_TARGET: ${{ github.event.release.target_commitish }}
          WORKFLOW_REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_EVENT_NAME" == "release" && "$RELEASE_TARGET" != "master" ]]; then
            echo "Das Release muss auf master basieren, nicht auf $RELEASE_TARGET."
            exit 1
          fi

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$WORKFLOW_REF" != "master" ]]; then
            echo "Das manuelle Publishing muss vom master-Branch gestartet werden, nicht von $WORKFLOW_REF."
            exit 1
          fi

          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Ungültiger Release-Tag: $RELEASE_TAG"
            echo "Erwartetes Format: v3.1.1"
            exit 1
          fi

          POM_VERSION="$(mvn -q help:evaluate \
            -Dexpression=project.version \
            -DforceStdout)"

          if [[ "$POM_VERSION" == *-SNAPSHOT ]]; then
            echo "SNAPSHOT-Versionen dürfen nicht veröffentlicht werden."
            exit 1
          fi

          if [[ "v$POM_VERSION" != "$RELEASE_TAG" ]]; then
            echo "Release-Tag:    $RELEASE_TAG"
            echo "POM-Version:    $POM_VERSION"
            exit 1
          fi

          if ! git -c safe.directory="$GITHUB_WORKSPACE" \
            merge-base --is-ancestor HEAD origin/master; then
            echo "Der Release-Tag $RELEASE_TAG zeigt nicht auf einen Commit aus master."
            exit 1
          fi

          mvn --version

      - name: Tests ausführen und veröffentlichen
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          MAVEN_GPG_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: mvn -B -Prelease -Dgpg.signer=bc clean deploy
