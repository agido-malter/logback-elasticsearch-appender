name: Test publishing credentials

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-credentials:
    name: Test Maven Central and GPG credentials
    runs-on: ubuntu-latest

    environment:
      name: maven-central

    steps:
      - name: Projekt auschecken
        uses: actions/checkout@v7

      - name: Java, Maven Central und GPG konfigurieren
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}

      - name: Build und GPG-Signierung testen
        env:
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: mvn -B clean verify

      - name: Maven-Central-Token testen
        shell: bash
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
        run: |
          set -euo pipefail

          AUTH_TOKEN="$(
            printf '%s:%s' "$CENTRAL_USERNAME" "$CENTRAL_PASSWORD" |
            base64 |
            tr -d '\n'
          )"

          HTTP_STATUS="$(
            curl --silent \
              --show-error \
              --output /dev/null \
              --write-out '%{http_code}' \
              --header "Authorization: Bearer $AUTH_TOKEN" \
              "https://ossrh-staging-api.central.sonatype.com/manual/search/repositories?ip=any&profile_id=com.agido"
          )"

          if [[ "$HTTP_STATUS" != "200" ]]; then
            echo "Central-Authentifizierung fehlgeschlagen: HTTP $HTTP_STATUS"
            exit 1
          fi

          echo "Central-Authentifizierung erfolgreich."
